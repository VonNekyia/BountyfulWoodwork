# Presets TreeArchive brings along, in namespaces everyone may use. Their marker blocks:
#   gold_block       broadleaf trees - beech, maple, oak
#   diamond_block    conifers - spruce, fir, pine, and larch, which turns golden in autumn
#   emerald_block    birches
#   redstone_block   fruit and accent trees - persimmon, fever tree
#   netherite_block  dark and old trees - dark oak, pale oak, windswept spruce
# One tree may stand on a block twice, painted two ways, half the trees each.
# A namespace preset of the same name in namespaces.yml goes first; taking it away there
# brings this one back. Leaf textures are a mid grey and a colour only darkens them, so
# light colours go with &bright. Blossoms, &blossom=#..., on &bloom percent of the leaves,
# and the secondary colour, &second=#..., show with ColorfulLeaves 1.1.
