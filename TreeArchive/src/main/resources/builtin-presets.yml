  - "diamond_block:norway_spruce*#cfd8dc&bright&blossom=#ffffff&bloom=40,silver_fir*#b0c4cc&bright&blossom=#ffffff&bloom=45,white_fir*#e0f2f1&bright&blossom=#ffffff&bloom=40"
