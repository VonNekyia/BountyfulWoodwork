# Every tree this plugin places comes from the archive (see below). Wherever trees are
# chosen - /ta brush, /ta layout, /ta preview, /ta debug generation and saplings under
# 'trees' - they are written the way WorldEdit writes blocks: birch, birch,oak or
# 70%birch,30%oak. A word may be a tree type, a size, a creator or a piece of a tree's
# name.

# Rotate each pasted tree by a random multiple of 90 degrees.
random-rotation: true

# false: trees never replace existing blocks. A tree only grows or is placed if its
# body lands on air, leaves, saplings or plants like grass and flowers; otherwise
# nothing happens and the sapling stays. Leaves, grass and vines of the tree itself
# only go where such soft blocks are. true: no checks, the tree overwrites everything.
#
# Either way, where the bottom of a trunk hangs over air it reaches one block down.
overwrite-blocks: false

# How far away, in blocks, a tree brush can place trees.
brush-range: 256

# Vanilla tree -> the archived trees that grow in its place when a sapling grows,
# written like everywhere else: BIRCH: birch, or TREE: 80%oak,20%birch. Vanilla trees
# left out, or whose trees match nothing in the archive, grow as vanilla.
#
# Vanilla types: TREE, BIG_TREE, SWAMP, BIRCH, TALL_BIRCH, REDWOOD, TALL_REDWOOD,
# MEGA_REDWOOD, MEGA_PINE, SMALL_JUNGLE, COCOA_TREE, JUNGLE, ACACIA, DARK_OAK,
# CHERRY, MANGROVE, TALL_MANGROVE, PALE_OAK, PALE_OAK_CREAKING, AZALEA,
# CRIMSON_FUNGUS, WARPED_FUNGUS, RED_MUSHROOM, BROWN_MUSHROOM
trees: {}
#  TREE: 80%oak,20%birch
#  BIG_TREE: oak_large,oak_giant
#  BIRCH: birch

# /ta debug generation replaces the trees of newly generated chunks, to look at whole
# forests of one type. Clearing a chunk happens early so no vanilla tree is left
# standing; the trees are then placed a few at a time. Both share this much time per
# tick, so the forest fills in slowly instead of freezing the server.
debug-generation:
  tick-budget-ms: 2
  # At most this many trees are replaced per chunk.
  trees-per-chunk: 16

# Archiving a tree: select it with //pos1 and //pos2, mark the block it stands on with
# //trunkpos or /ta trunkpos, then /ta archive <type> <creator>. The type is one of the
# tree types made with /ta type <name>, kept in types.yml. The tree names itself
# type_size_creator_number, like birch_medium_snifferish_1, and its schematic and a yml
# with type, creator, origin and size land in the archive folder. The creator
# is either a player, kept by uuid, or an artist registered once with
# /ta patreon <name> <link>; after that the name alone is enough. That link is to the
# artist, not to a pack.
#
# Every archived tree is sorted into one of these by how big it reads: its height plus
# its widest side. Neither alone tells trees apart - a fir is tall and thin where an oak
# is short and broad - but added up they sort the way a builder would. Fitted against
# the trees already archived by hand, this agrees with 87 of every 100 of them and is
# never off by more than one step; /ta archive --size <category> overrules it, and a
# tree too wide for a category's plot moves up a step on its own. Plot sizes are odd
# multiples of three, so the three by three checkerboard has one middle block.
categories:
  - name: shrub
    max-size: 12
    plot-size: 9
  - name: little
    max-size: 25
    plot-size: 15
  - name: medium
    max-size: 39
    plot-size: 27
  - name: large
    max-size: 60
    plot-size: 39
  - name: giant
    max-size: 90
    plot-size: 51
  - name: fantasy
    max-size: 1000
    plot-size: 81


# /ta layout categorized [trees] lays the archive out where you stand: a plot per tree,
# ordered by type, then creator, then size, each floored with a checkerboard of light
# gray and cyan terracotta and a red block in the middle, where the trunk goes. The
# trees are written like WorldEdit blocks - birch,oak or 70%birch,30%oak - or left out
# for everything in the archive.
layout:
  # Plots in a row before the next row begins; a new type always starts a new row.
  row-length: 8
  # Time spent per tick while working.
  tick-budget-ms: 10

# /ta preview shows a forest to you alone: every marker block around where you stand
# becomes an archived tree, sent to your client and nowhere else.
#   /ta preview gold_block:silver_fir,white_pine/diamond_block:beech
#   /ta preview gold_block,diamond_block:beech
# Asking again shuffles the trees; /ta preview player <name> sends someone yours, and
# hitting a ghost trunk takes that tree away. A marker left standing had no room.
preview:
  # How far around you markers are looked for, and how much of the height.
  radius: 150
  # The most trees one preview shows. More markers than this and there is no preview:
  # a guard against marking with a block that is everywhere, like stone. With
  # --continuous the preview stops growing at this many instead, and until then grows
  # the markers of every chunk loaded later.
  max-trees: 500
  min-y: -64
  max-y: 160
  # Time spent per tick while growing a preview.
  tick-budget-ms: 5


# /ta duplicates reads every blueprint and reports the trees that are in the archive
# twice, turned or mirrored. It compares the blocks around each tree, not the selection
# it was saved from, so extra air or a trunk marked a block over changes nothing.
duplicates:
  tick-budget-ms: 10

# /ta forest <preset> [x z] plants a saved marker pattern on the middle of the map.
# A preset is a schematic in plugins/TreeArchive/presets; every marker block in
# it becomes one tree, standing on whatever ground it ends up over. Save one from a
# WorldEdit selection with /ta forest save <name>.
forest:
  # The middle of the map, where a preset's middle lands.
  center-x: 0
  center-z: 0
  # Time spent per tick while planting.
  tick-budget-ms: 5
  # Which block means a tree, and which archived trees it may become: a category, a
  # tree type, or "any". Add a line per block to mix them inside one preset.
  markers:
    gold_block: any
