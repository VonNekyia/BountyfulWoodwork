# Trees this plugin knows of cannot be broken block by block. Cutting into the trunk
# takes longer the bigger the tree, and once that block breaks the whole tree comes
# down. Players in creative with the bountyfulwoodwork.admin permission still break
# single blocks.
felling:
  # Cutting time = the block's normal break time x tree blocks (leaves included)
  # x time-per-block. 1.0 with a 200 block tree takes 200 times as long.
  time-per-block: 1.0
  # Upper limit for cutting one tree without Efficiency, in seconds. Efficiency
  # shortens the time from there, like it does for any block.
  max-seconds: 30
  # The leaves of a felled tree disappear at random within this many ticks.
  leaf-decay-ticks: 40
  # What a felled tree drops, per tree type; "default" covers every
  # type without its own list. item: a vanilla item like spruce_log, or a Nexo item as
  # nexo:<id>. per-block: amount per trunk block (everything but leaves), so 0.25 is
  # one item for every four trunk blocks.
  drops:
    default:
      - item: oak_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001
    birch:
      - item: birch_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001
    pine:
      - item: spruce_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001
    norway_pine:
      - item: spruce_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001
    white_pine:
      - item: spruce_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001
    silver_fir:
      - item: spruce_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001
    larch:
      - item: spruce_log
        per-block: 0.25
      - item: nexo:hardwood
        per-block: 0.001

# Leaf colours for players with the ColorfulLeaves client mod, by tree type, or by the
# id of an archived tree, which goes first. Everyone else, and types without an entry,
# see the usual leaves - as does everyone for azalea, cherry, pale oak and poplar
# leaves, whose colour is in their texture. A type gets
#   one colour:             larch: "#d9a42b"
#   one of several:         maple: ["#b5361d", "#cc4f1f"]   - each tree keeps its own
#   a fade over the crown:  fade: [first, ..., last]        - two colours or more
#                           direction: up   - from the bottom of the crown to the top
#                           direction: out  - from the middle of the crown to its edge
# Leaf textures are a mid grey, and a colour only darkens them - white comes out grey.
# bright: true draws the leaves on a lighter copy of their texture instead, for whites,
# pastels and anything that should glow; it goes with a fade, or with one colour or
# several written as colour: "#ffffff" or colours: [...].
leaf-colors:
  maple: ["#b5361d", "#cc4f1f", "#e07b24"]
  larch: "#d9a42b"
  beech:
    fade: ["#6b3a14", "#c8742a", "#f0b347"]
    direction: up
